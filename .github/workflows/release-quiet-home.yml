name: Release quiet-home

on:
  push:
    tags:
      - "quiet-home-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - name: Verify tag version matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/quiet-home-v}"
          PACKAGE_VERSION=$(node -e "console.log(require('./plugins/quiet-home/package.json').version)")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version (${TAG_VERSION}) does not match package.json version (${PACKAGE_VERSION})"
            exit 1
          fi

      - run: npm publish --provenance --access public
        working-directory: plugins/quiet-home
